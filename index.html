<title>Horário EPALC</title>

<style>
/* Layout: coluna única pensada para o telemóvel; cabeçalho fixo com turma e dias; aulas como linhas de um livro de ponto */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#15212c; --muted:#5a6774; --line:#d9e0e7;
  --accent:#0d5d8f; --accent-soft:#dcebf5; --accent-ink:#ffffff; --now:#c2410c;
  --c1:#5a48c2; --c2:#6f7b88; --c3:#1489c4; --c4:#3550d1; --c5:#d63d33; --c6:#2f8f3a; --c7:#b7791f; --c8:#b03a8a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f161d; --surface:#17212b; --ink:#e7edf2; --muted:#9aa8b5; --line:#283643;
    --accent:#5fb0e6; --accent-soft:#16344a; --accent-ink:#0b1a24; --now:#fb923c;
    --c1:#9a8cf0; --c2:#a3aebb; --c3:#4fb8ec; --c4:#7d93f5; --c5:#f2766d; --c6:#6cc777; --c7:#e0a64a; --c8:#e07bbd;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --ink:#e7edf2; --muted:#9aa8b5; --line:#283643;
  --accent:#5fb0e6; --accent-soft:#16344a; --accent-ink:#0b1a24; --now:#fb923c;
  --c1:#9a8cf0; --c2:#a3aebb; --c3:#4fb8ec; --c4:#7d93f5; --c5:#f2766d; --c6:#6cc777; --c7:#e0a64a; --c8:#e07bbd;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:grid;gap:12px;padding-block:14px 12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo img{display:block;height:44px;width:auto;flex:none}
.logo .eyebrow{border-left:1px solid var(--line);padding-left:12px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;text-transform:none;color:var(--ink);line-height:44px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo img{filter:invert(1)}}
:root[data-theme="dark"] .logo img{filter:invert(1)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.turma{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;margin:0;letter-spacing:-.02em}
.semana{color:var(--muted);font-size:14px}
select{min-width:0;max-width:8.5rem;flex:0 1 auto;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 0 7px;cursor:pointer;display:grid;justify-items:center;gap:0;position:relative}
.day b{font-size:13px;font-weight:700;color:var(--muted)}
.day span{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.day[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-selected="true"] b{color:var(--accent-ink);opacity:.85}
.day .hoje{position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--now)}

.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;justify-self:start}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:5px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

main .wrap{display:grid;gap:18px;padding-block:18px 32px}

/* A seguir */
.next{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.next .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.next h2{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
.next p{margin:0;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--accent);white-space:nowrap}
.pill.live{background:var(--now);color:#fff}

/* Lista do dia */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dayhead h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
.dayhead small{color:var(--muted);font-size:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lesson{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.lesson:first-child{border-top:0}
.time{font-variant-numeric:tabular-nums;display:grid;line-height:1.25}
.time b{font-size:17px}
.time span{font-size:13px;color:var(--muted)}
.subj{display:grid;gap:3px;min-width:0}
.subj strong{font-size:17px;line-height:1.25;display:flex;align-items:center;gap:8px}
.sw{flex:none;width:12px;height:12px;border-radius:3px;background:var(--c)}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.lesson.is-now{background:color-mix(in srgb,var(--now) 9%,var(--surface))}
.lesson.is-now .time b{color:var(--now)}
.lesson.is-past{opacity:.55}
.gap{padding:5px 14px 5px 86px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}

/* Semana */
.gridbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:340px;font-variant-numeric:tabular-nums}
th,td{padding:4px;text-align:center;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:700;padding-block:8px}
thead th.today{color:var(--now)}
tbody th{font-size:12px;color:var(--muted);font-weight:700;width:46px}
td .cell{display:grid;place-items:center;min-height:38px;border-radius:7px;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink);border-left:3px solid var(--c)}
tr.pausa th,tr.pausa td{padding:2px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;background:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.install{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:14px}
.install p{margin:0;flex:1;min-width:0}
.install button{font:inherit;font-size:13px;font-weight:700;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:2px 4px}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
footer p{margin:0;max-width:62ch}

@media (prefers-reduced-motion:no-preference){
  .lesson,.next{animation:in .25s ease both}
  @keyframes in{from{transform:translateY(4px)}to{transform:none}}
}
</style>

</head>

<script>
/* ---------- Dados (mesma forma que o e-Schooling devolve: uma aula = dia + início + fim) ---------- */
/* ---------- Dados: horario.json (atualizado todas as semanas) ---------- */
const DATA_URL = location.protocol === "file:"
  ? "https://darlslayer1982.github.io/horario-epalc/horario.json"
  : "horario.json";
let DISCIPLINAS = {};
let HORARIOS = {};
let META = null;
let OFFLINE = false;

/* ---------- Utilitários ---------- */
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DIAS_CURTOS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const $ = s => document.querySelector(s);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const toDate = (dia,hora) => new Date(`${dia}T${hora}:00`);
const minutos = (a,b) => Math.round((b - a) / 60000);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};

/* ---------- Estado ---------- */
let turma = null;
let diaSel = null;
let vista = store.get("epalc-vista") === "semana" ? "semana" : "dia";

function aulasDaTurma(){
  return HORARIOS[turma].aulas.map(({dia, inicio:ini, fim, disciplina:disc, modulo}) => ({
    dia, ini, fim, disc, modulo,
    d: DISCIPLINAS[disc] || { nome: disc, abrev: disc, cor: "--c2" },
    start: toDate(dia,ini), end: toDate(dia,fim)
  })).sort((a,b) => a.start - b.start);
}
function diasDaSemana(){
  const base = new Date(`${HORARIOS[turma].semana}T12:00:00`);
  return Array.from({length:5}, (_,i) => { const d = new Date(base); d.setDate(base.getDate()+i); return d; });
}

/* ---------- Render ---------- */
function renderTurmas(){
  const sel = $("#turmaSel");
  sel.innerHTML = Object.keys(HORARIOS).map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")
    + `<option disabled>Mais turmas em breve</option>`;
  sel.value = turma;
  sel.onchange = () => { turma = sel.value; store.set("epalc-turma", turma); diaSel = null; renderAll(); };
}

function renderDias(){
  const hoje = ymd(new Date());
  const dias = diasDaSemana();
  const f = dias[0], l = dias[4];
  $("#turmaNome").textContent = turma;
  $("#semanaLbl").textContent = `Semana de ${f.getDate()} a ${l.getDate()} ${MESES[l.getMonth()]} ${l.getFullYear()}`;

  const keys0 = dias.map(ymd);
  if(!diaSel || !keys0.includes(diaSel)){
    diaSel = keys0.includes(hoje) ? hoje : keys0[0];
  }
  $("#days").innerHTML = dias.map(d => {
    const k = ymd(d);
    return `<button class="day" role="tab" data-dia="${k}" aria-selected="${k===diaSel}" aria-label="${DIAS[d.getDay()]} ${d.getDate()}">
      ${k===hoje ? '<i class="hoje" aria-hidden="true"></i>' : ""}
      <b>${DIAS_CURTOS[d.getDay()]}</b><span>${d.getDate()}</span></button>`;
  }).join("");
  $("#days").querySelectorAll(".day").forEach(b => b.onclick = () => {
    diaSel = b.dataset.dia;
    if(vista === "semana") setVista("dia");
    renderDias(); renderDia();
  });
}

function quando(d, now){
  const k = ymd(d), hoje = ymd(now);
  const am = new Date(now); am.setDate(now.getDate()+1);
  if(k === hoje) return "Hoje";
  if(k === ymd(am)) return "Amanhã";
  return `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}`;
}

function renderNext(){
  const now = new Date();
  const aulas = aulasDaTurma();
  const atual = aulas.find(a => a.start <= now && now < a.end);
  const prox = aulas.find(a => a.start > now);
  const el = $("#next");

  if(atual){
    const resta = minutos(now, atual.end);
    el.innerHTML = `<div class="row"><span class="eyebrow">Agora</span><span class="pill live">Faltam ${resta} min</span></div>
      <h2>${esc(atual.d.nome)}</h2>
      <p>${atual.ini}–${atual.fim}${prox && ymd(prox.start)===ymd(now) ? ` · a seguir: ${esc(prox.d.nome)} às ${prox.ini}` : ""}</p>`;
  } else if(prox){
    const falta = minutos(now, prox.start);
    const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const d1 = new Date(prox.start.getFullYear(), prox.start.getMonth(), prox.start.getDate());
    const nd = Math.round((d1 - d0) / 86400000);
    const pill = falta < 60 ? `Daqui a ${falta} min` : nd === 0 ? "Hoje" : nd === 1 ? "Amanhã" : `Daqui a ${nd} dias`;
    el.innerHTML = `<div class="row"><span class="eyebrow">Próxima aula</span><span class="pill">${esc(pill)}</span></div>
      <h2>${esc(prox.d.nome)}</h2>
      <p>${esc(quando(prox.start, now))} · ${prox.ini}–${prox.fim}</p>`;
  } else {
    el.innerHTML = `<span class="eyebrow">Fim da semana</span>
      <h2>Sem mais aulas nesta semana</h2>
      <p>O horário da próxima semana aparece aqui quando for publicado.</p>`;
  }
}

function renderDia(){
  const now = new Date();
  const d = new Date(`${diaSel}T12:00:00`);
  const aulas = aulasDaTurma().filter(a => a.dia === diaSel);
  $("#dayTitle").textContent = `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
  $("#dayCount").textContent = aulas.length ? `${aulas.length} tempos · ${aulas[0].ini}–${aulas[aulas.length-1].fim}` : "";

  if(!aulas.length){ $("#list").innerHTML = `<div class="empty">Sem aulas neste dia.</div>`; return; }

  let html = "";
  aulas.forEach((a,i) => {
    if(i>0){
      const g = minutos(aulas[i-1].end, a.start);
      if(g >= 10) html += `<div class="gap">${g >= 40 ? "Almoço" : "Intervalo"} · ${g} min</div>`;
    }
    const cls = (a.start <= now && now < a.end) ? "is-now" : (a.end <= now ? "is-past" : "");
    html += `<div class="lesson ${cls}">
      <div class="time"><b>${a.ini}</b><span>${a.fim}</span></div>
      <div class="subj">
        <strong><i class="sw" style="--c:var(${a.d.cor})" aria-hidden="true"></i>${esc(a.d.nome)}</strong>
        <div class="meta">${a.modulo ? `<span>UFCD ${esc(a.modulo)}</span>` : ""}${cls==="is-now" ? "<span>A decorrer</span>" : ""}</div>
      </div>
    </div>`;
  });
  $("#list").innerHTML = html;
}

function renderSemana(){
  const dias = diasDaSemana();
  const keys = dias.map(ymd);
  const hoje = ymd(new Date());
  const aulas = aulasDaTurma();
  const slots = [...new Set(aulas.map(a => a.ini))].sort();

  let html = `<thead><tr><th></th>${dias.map(d => `<th class="${ymd(d)===hoje?"today":""}">${DIAS_CURTOS[d.getDay()]} ${d.getDate()}</th>`).join("")}</tr></thead><tbody>`;
  slots.forEach((s,i) => {
    if(i>0 && s >= "13:00" && slots[i-1] < "13:00"){
      html += `<tr class="pausa"><th></th><td colspan="5">Almoço</td></tr>`;
    }
    html += `<tr><th scope="row">${s}</th>`;
    keys.forEach(k => {
      const a = aulas.find(x => x.dia===k && x.ini===s);
      html += a ? `<td><div class="cell" style="--c:var(${a.d.cor})" title="${esc(a.d.nome)}">${esc(a.d.abrev)}</div></td>` : `<td></td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody>`;
  $("#grid").innerHTML = html;

  const usadas = [...new Set(aulas.map(a => a.disc))];
  $("#legend").innerHTML = usadas.map(k => `<span><i class="sw" style="--c:var(${DISCIPLINAS[k].cor})"></i><b>${esc(DISCIPLINAS[k].abrev)}</b> ${esc(DISCIPLINAS[k].nome)}</span>`).join("");
}

function setVista(v){
  vista = v; store.set("epalc-vista", v);
  $("#vDia").setAttribute("aria-pressed", v==="dia");
  $("#vSemana").setAttribute("aria-pressed", v==="semana");
  $("#dayView").hidden = v !== "dia";
  $("#weekView").hidden = v !== "semana";
}

function renderAll(){ renderTurmas(); renderDias(); renderNext(); renderDia(); renderSemana(); setVista(vista); }

$("#vDia").onclick = () => setVista("dia");
$("#vSemana").onclick = () => setVista("semana");
function renderFonte(){
  const t = META && META.atualizado ? new Date(META.atualizado) : null;
  const quando = t ? `${t.getDate()} ${MESES[t.getMonth()]}, ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}` : "";
  $("#fonte").innerHTML = `<strong>Versão piloto.</strong> ${esc(META?.fonte || "")}${quando ? ` · atualizado a ${quando}` : ""}. Pode haver trocas de última hora.`
    + (OFFLINE ? `<br>Sem ligação à internet: a mostrar a última versão guardada.` : "");
}

async function carregar(){
  try {
    const r = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });
    if(r.ok){
      const data = await r.json();
      store.set("epalc-dados", JSON.stringify(data));
      OFFLINE = false;
      return data;
    }
  } catch {}
  try {
    const guardado = JSON.parse(store.get("epalc-dados"));
    if(guardado){ OFFLINE = true; return guardado; }
  } catch {}
  return null;
}

function aplicar(data){
  META = data;
  DISCIPLINAS = {};
  for(const [k, v] of Object.entries(data.disciplinas || {})){
    DISCIPLINAS[k] = { ...v, cor: `--c${v.cor || 2}` };
  }
  HORARIOS = data.turmas || {};
  const guardada = store.get("epalc-turma");
  if(!turma || !HORARIOS[turma]) turma = HORARIOS[guardada] ? guardada : Object.keys(HORARIOS)[0];
}

async function boot(){
  const data = await carregar();
  if(!data || !Object.keys(data.turmas || {}).length){
    $("#next").innerHTML = `<span class="eyebrow">Sem horário</span><h2>Não foi possível carregar o horário</h2><p>Verifica a ligação à internet e abre a app outra vez.</p>`;
    $("#fonte").innerHTML = "<strong>Versão piloto.</strong>";
    return;
  }
  aplicar(data);
  renderAll();
  renderFonte();
}

(function(){
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const app = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  if(ios && !app && location.protocol === "https:" && store.get("epalc-dica") !== "fechada"){
    $("#install").hidden = false;
    $("#installClose").onclick = () => { $("#install").hidden = true; store.set("epalc-dica","fechada"); };
  }
  if("serviceWorker" in navigator && location.protocol === "https:"){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();

boot();
setInterval(() => { if(turma){ renderNext(); renderDia(); } }, 60000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") boot(); });
</script>

</body>
